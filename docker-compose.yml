services:
  rag:
    build: ./rag-backend
    ports: ["8000:8000"]
    env_file: .env
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-extractive}
      OLLAMA_URL: http://ollama:11434
  gateway:
    build: ./gateway
    ports: ["3001:3001"]
    environment:
      RAG_URL: http://rag:8000
    depends_on: [rag]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [gateway]
  # Optional quantized OSS LLM:
